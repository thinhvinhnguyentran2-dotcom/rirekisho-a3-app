<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>キャッシュを更新しています</title>
<style>body{font-family:system-ui,sans-serif;display:grid;place-content:center;min-height:100vh;margin:0;background:#f8fafc;color:#0f172a}main{text-align:center;padding:24px;border:1px solid #cbd5e1;border-radius:14px;background:#fff;box-shadow:0 12px 30px rgba(15,23,42,.1)}</style>
</head>
<body><main><strong>最新版へ更新しています…</strong><p id="status">キャッシュを削除しています。</p></main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
  if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}
  status.textContent='更新が完了しました。アプリを開きます。';
 }catch(e){console.warn(e);status.textContent='キャッシュ更新を続行します。';}
 const target=new URLSearchParams(location.search).get('target')||'./?v=2.8.7';
 setTimeout(()=>location.replace(target+(target.includes('?')?'&':'?')+'ts='+Date.now()),500);
})();
</script></body></html>
